<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: 'A personal atlas of trips, photographs, and memories.' | escape }}">
  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/travels.css' | relative_url }}">
  {% if page.trip %}
  <link rel="stylesheet" href="{{ '/assets/css/journey.css' | relative_url }}">
  <script type="module" src="{{ '/assets/js/journey.js' | relative_url }}"></script>
  {% else %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  <script src="{{ '/assets/js/travels.js' | relative_url }}" defer></script>
  {% endif %}
</head>
<body class="travel-site{% if page.trip %} journey-page{% endif %}">
  <a class="skip-link" href="#travel-content">Skip to content</a>
  {% unless page.trip %}<header class="travel-header">
    <a class="travel-brand" href="{{ '/travels/' | relative_url }}">{{ site.title | escape }}<span>Travel journals</span></a>
    <a class="home-link" href="{{ '/' | relative_url }}">Back to the main site <span aria-hidden="true">↗</span></a>
  </header>{% endunless %}
  <main id="travel-content">{{ content }}</main>
  {% unless page.trip %}<footer class="travel-footer"><span>Places visited. Moments kept.</span><a href="{{ '/travels/' | relative_url }}">All travels <span aria-hidden="true">↗</span></a></footer>{% endunless %}
</body>
</html>
